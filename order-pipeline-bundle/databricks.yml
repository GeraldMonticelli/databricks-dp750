# This is a Declarative Automation Bundle definition for databricks-dp750.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: order-pipeline-bundle

variables:
  # The following variables are used in the bundle's configuration.
  # You can override these variables when you run the bundle.
  #
  # For example, to override the 'workspace_host' variable, you can run:
  #   databricks bundle run --var workspace_host=https://your-databricks-workspace-url
  #
  # The default values for these variables are defined below.
  cluster_policy_id:
    description: The ID of the cluster policy to use for the job cluster.
    default: ""
  environment:
    description: The environment for which to configure the bundle.
    default: development

resources:
  jobs:
    order-pipeline-job:
      name: ${var.environment}-order-pipeline
      tasks:
        - task_key: validate-data
          notebook_task:
            notebook_path: ./notebooks/validate.py
        - task_key: transform-data
          depends_on:
            - task_key: validate-data
          notebook_task:
            notebook_path: ./notebooks/transform.py
  
targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405613337187597.17.azuredatabricks.net
    variables:
      environment: development

  ## Optionally, there could be 'staging' or 'prod' targets here.
  #
  # prod:
  #   workspace:
  #     host: https://adb-7405613337187597.17.azuredatabricks.net
